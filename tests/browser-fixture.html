<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><base href="/"><title>Pruebas locales de Anya</title><style>body{font:18px system-ui;max-width:700px;margin:50px auto;padding:24px;background:#f7f3e8;color:#2d493c}button{display:block;font:inherit;padding:16px;margin:15px 0}p{line-height:1.6}a{color:inherit}</style></head><body><h1>Pruebas locales de la aventura</h1><p>Este panel solo está disponible en el servidor de desarrollo con <code>--qa</code>. Cada botón prepara una partida de prueba en este navegador y abre el juego. No se publica en GitHub Pages.</p><button data-case="growth">Preparar primer estirón en 3 segundos</button><button data-case="deadline">Preparar derrota en 3 segundos</button><button data-case="almost">Preparar materiales completos con 3 segundos</button><button data-case="cake">Preparar pastel listo para soplar</button><button data-case="full">Preparar pastel con ocho ingredientes y ocho regalos</button><button data-case="fresh">Preparar aventura nueva</button><p><a href="/">Volver al juego sin cambiar la partida</a></p><script type="module">
import {createGame,completeQuest,QUESTS,ZONES,advanceTime,GAME_DURATION,GROWTH_INTERVAL,bakeCake} from './logic.js?v=3.4';
for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{
 let state={...createGame(20261016),clockStarted:true,position:{x:1270,y:845}};
 const type=button.dataset.case;
 if(type==='full'){for(const q of QUESTS)state=completeQuest(state,q.id);}
 if(type==='almost'||type==='cake'){
  for(const q of QUESTS.filter(q=>q.level===0))state=completeQuest(state,q.id);
  for(const q of QUESTS.filter(q=>q.level===1&&ZONES[q.zone].ingredient<3))state=completeQuest(state,q.id);
 }
 if(type==='growth')state=advanceTime(state,GROWTH_INTERVAL-3000);
 if(type==='deadline'||type==='almost')state=advanceTime(state,GAME_DURATION-3000);
 if(type==='cake'||type==='full')state=bakeCake(state);
 if(type==='fresh')state=createGame(20261016);
 localStorage.setItem('anya-garden-v3',JSON.stringify(state));location.href='/';
});
</script></body></html>
